quarkus:
  http:
    port: 9080
  log:
    category:
      "org.opendatamesh.platform.up.executor.gitlab":
        level: INFO
executor:
  gitlab:
    default-base-url: https://gitlab.com
    allowed-base-urls:
      - https://gitlab.com
    http:
      connect-timeout: 5s
      read-retries: 2
    input-spec:
      cache-miss-retry-interval: 1s
      cache-miss-budget: 20s
    logs:
      max-job-log-size: 1M
      max-total-size: 5M
"%test":
  quarkus:
    http:
      test-port: 0
  executor:
    gitlab:
      http:
        read-retries: 0
      input-spec:
        cache-miss-retry-interval: 50ms
        cache-miss-budget: 300ms
